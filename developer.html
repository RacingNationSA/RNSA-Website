<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RNSA | Developer Access</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            background: #0d0d0d;
            border: 1px solid #292929;
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-r {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e00000;
            font-size: 30px;
            font-weight: 900;
        }

        h1 {
            font-size: 22px;
            letter-spacing: 5px;
        }

        .subtitle {
            margin-top: 8px;
            color: #777;
            font-size: 10px;
            letter-spacing: 3px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #999;
            font-size: 10px;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #111;
            border: 1px solid #333;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #e00000;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #e00000;
            border: none;
            color: white;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
        }

        button:hover {
            background: #b00000;
        }

        #login-message {
            min-height: 20px;
            margin-top: 15px;
            text-align: center;
            color: #e00000;
            font-size: 12px;
        }

        .back {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #777;
            text-decoration: none;
            font-size: 11px;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            <div class="logo-r">R</div>

            <h1>RNSA</h1>

            <p class="subtitle">DEVELOPER ACCESS</p>
        </div>

        <form id="login-form">

            <label for="email">EMAIL</label>

            <input
                type="email"
                id="email"
                placeholder="Developer email"
                required
            >

            <label for="password">PASSWORD</label>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                LOGIN
            </button>

            <p id="login-message"></p>

        </form>

        <a href="index.html" class="back">
            ← BACK TO RNSA WEBSITE
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

</body>
</html>
