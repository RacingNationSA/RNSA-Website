<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RNSA | Admin Login Test</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="admin-login-page">

    <div class="login-container">

        <div class="login-logo">

            <div class="login-r">
                R
            </div>

            <h1>
                RNSA
            </h1>

            <p>
                ADMINISTRATION
            </p>

        </div>


        <form id="login-form">

            <label for="email">
                EMAIL
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                PASSWORD
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="login-button"
            >
                LOGIN
            </button>


            <p
                id="login-message"
                class="login-message"
            ></p>

        </form>


        <a
            href="index.html"
            class="back-home"
        >
            ← BACK TO RNSA
        </a>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="auth.js"></script>

</body>

</html>
